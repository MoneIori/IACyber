name: Deploy IACyber to AWS

on:
  push:
    branches:
      - main  # Si attiva quando carichi sul branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Installazione Docker Compose Plugin se non presente
            if ! docker compose version &> /dev/null; then
              echo "Installazione Docker Compose plugin..."
              sudo yum update -y
              sudo yum install docker-compose-plugin -y
            fi

            # 2. Gestione della cartella del progetto
            if [ ! -d "IACyber" ]; then
              echo "Primo deploy: clono il repository..."
              git clone https://github.com
            else
              echo "Aggiornamento progetto esistente..."
            fi
            
            # Entriamo nella cartella
            cd IACyber
            
            # 3. Allineamento codice (pulisce eventuali conflitti)
            git fetch --all
            git reset --hard origin/main
            git pull origin main

            # 4. Avvio dei container
            echo "Building e avvio dei container..."
            # Usiamo 'sudo docker compose' (con lo spazio, versione 2)
            sudo docker compose up -d --build

            # 5. Pulizia immagini vecchie per risparmiare spazio su AWS Free Tier
            sudo docker image prune -f

            # 6. Verifica finale
            echo "Ecco i container attivi ora:"
            sudo docker ps

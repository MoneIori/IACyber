name: Deploy IACyber to AWS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Installazione Docker Compose (Binario stabile)
            if ! command -v docker-compose &> /dev/null; then
              echo "Installazione manuale in corso..."
              sudo curl -L "https://github.com" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi

            # 2. Gestione progetto
            if [ ! -d "IACyber" ]; then
              git clone https://github.com/MoneIori/IACyber.git
            fi
            
            cd IACyber
            git fetch --all
            git reset --hard origin/main
            
            # 3. Avvio (comando col trattino)
            echo "Avvio build container..."
            sudo /usr/local/bin/docker-compose up -d --build
            
            # 4. Verifica
            sudo docker ps

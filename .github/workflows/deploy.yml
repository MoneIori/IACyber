name: Deploy IACyber to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Installazione manuale di Docker Compose (Binario diretto)
            if ! command -v docker-compose &> /dev/null; then
              echo "Installazione manuale di docker-compose..."
              sudo curl -L "https://github.com(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              # Crea un link simbolico per sicurezza
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi

            # 2. Gestione cartella
            if [ ! -d "IACyber" ]; then
              git clone https://github.com
            fi
            
            cd IACyber
            git fetch --all
            git reset --hard origin/main
            
            # 3. Avvio (Usiamo il comando col trattino docker-compose)
            echo "Avvio build e container..."
            sudo docker-compose up -d --build
            
            # 4. Cleanup e verifica
            sudo docker image prune -f
            sudo docker ps

server:
  port: 8083

spring:
  application:
    name: container-scanner-service

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/iacyber}
    username: ${POSTGRES_USER:iacyber}
    password: ${POSTGRES_PASSWORD:iacyber_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: container-scanner
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/iacyber

iacyber:
  ai:
    container-api-url: ${CONTAINER_AI_API_URL:http://localhost:9006}
    internal-token: ${INTERNAL_TOKEN:iacyber-internal-dev-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.iacyber: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/iacyber
  kafka:
    bootstrap-servers: kafka:29092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/iacyber

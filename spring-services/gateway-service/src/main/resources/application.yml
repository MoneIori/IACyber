server:
  port: 8080

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/iacyber

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:iacyber_dev}

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1

      routes:
        - id: ingestion-service
          uri: lb://ingestion-service
          predicates:
            - Path=/api/ingest/**
          filters:
            - StripPrefix=2

        - id: siem-service
          uri: lb://siem-service
          predicates:
            - Path=/api/siem/**
          filters:
            - StripPrefix=2

        - id: ai-orchestrator
          uri: lb://ai-orchestrator-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2

        - id: compliance-service
          uri: lb://compliance-service
          predicates:
            - Path=/api/compliance/**
          filters:
            - StripPrefix=2

        - id: git-integration
          uri: lb://git-integration-service
          predicates:
            - Path=/api/git/**
          filters:
            - StripPrefix=2

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.iacyber: DEBUG
    org.springframework.cloud.gateway: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/iacyber
  data:
    redis:
      host: redis

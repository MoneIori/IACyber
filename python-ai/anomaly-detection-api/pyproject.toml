[tool.poetry]
name = "anomaly-detection-api"
version = "1.0.0"
description = "IACyber — Anomaly Detection AI Service"
authors = ["IACyber Team"]
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
scikit-learn = "^1.5.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
joblib = "^1.4.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
